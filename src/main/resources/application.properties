spring.application.name=marketplace

# ==============================
# Conexión a MySQL
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketplace?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
marketplace.upload.directory=${MARKETPLACE_UPLOAD_DIRECTORY:${user.home}/marketplace-uploads}

# Recuperación temporal de administrador. Dejar desactivada normalmente.
marketplace.security.bootstrap-admin.enabled=${MARKETPLACE_SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
marketplace.security.bootstrap-admin.email=${MARKETPLACE_ADMIN_EMAIL:}
marketplace.security.bootstrap-admin.password=${MARKETPLACE_ADMIN_PASSWORD:}

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect